<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="520" fill="#f8fafc"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#0f172a">Document Intelligence Pipeline: LangGraph StateGraph (src/pipeline/graph.py)</text>
  <text x="20" y="50" fill="#475569">Sin ANTHROPIC_API_KEY todo corre por la ruta determinista (cajas azules). Las cajas moradas requieren llave.</text>

  <!-- input -->
  <rect x="20" y="90" width="150" height="70" rx="10" fill="#e2e8f0" stroke="#475569"/>
  <text x="95" y="118" text-anchor="middle" font-weight="bold" fill="#0f172a">POST /api/extract</text>
  <text x="95" y="138" text-anchor="middle" fill="#334155">text | pdf_b64 | upload</text>
  <text x="95" y="153" text-anchor="middle" fill="#334155" font-size="11">422 · slowapi · CORS · X-Trace-Id</text>

  <!-- ingest -->
  <rect x="210" y="80" width="180" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="300" y="104" text-anchor="middle" font-weight="bold" fill="#1e3a8a">n_ingest</text>
  <text x="300" y="122" text-anchor="middle" fill="#1e3a8a" font-size="12">pdfplumber texto → densidad</text>
  <text x="300" y="138" text-anchor="middle" fill="#1e3a8a" font-size="12">text / ocr (tesseract)</text>
  <text x="300" y="154" text-anchor="middle" fill="#6d28d9" font-size="12">/ vlm (Claude Vision)</text>

  <!-- classify -->
  <rect x="430" y="80" width="170" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="515" y="104" text-anchor="middle" font-weight="bold" fill="#1e3a8a">n_classify</text>
  <text x="515" y="122" text-anchor="middle" fill="#1e3a8a" font-size="12">heurística ponderada</text>
  <text x="515" y="138" text-anchor="middle" fill="#6d28d9" font-size="12">Claude texto / visión</text>
  <text x="515" y="154" text-anchor="middle" fill="#1e3a8a" font-size="12">invoice·receipt·contract·form·report</text>

  <!-- tables -->
  <rect x="640" y="80" width="150" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="715" y="104" text-anchor="middle" font-weight="bold" fill="#1e3a8a">n_tables</text>
  <text x="715" y="122" text-anchor="middle" fill="#1e3a8a" font-size="12">pdfplumber lines/text</text>
  <text x="715" y="138" text-anchor="middle" fill="#1e3a8a" font-size="12">Camelot stream (opcional)</text>
  <text x="715" y="154" text-anchor="middle" fill="#1e3a8a" font-size="12">cell-level F1</text>

  <!-- extract -->
  <rect x="830" y="80" width="130" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="895" y="104" text-anchor="middle" font-weight="bold" fill="#1e3a8a">n_extract</text>
  <text x="895" y="122" text-anchor="middle" fill="#1e3a8a" font-size="12">HeuristicExtractor</text>
  <text x="895" y="138" text-anchor="middle" fill="#6d28d9" font-size="12">LLMExtractor (JSON)</text>
  <text x="895" y="154" text-anchor="middle" fill="#1e3a8a" font-size="12">esquema Pydantic</text>

  <!-- arrows top row -->
  <line x1="170" y1="125" x2="208" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="125" x2="428" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="125" x2="638" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="125" x2="828" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down to validate -->
  <line x1="895" y1="170" x2="895" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- validate -->
  <rect x="640" y="230" width="320" height="100" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="800" y="254" text-anchor="middle" font-weight="bold" fill="#14532d">n_validate</text>
  <text x="800" y="272" text-anchor="middle" fill="#14532d" font-size="12">requeridos · NIT mod-11 · fechas ISO · montos · moneda</text>
  <text x="800" y="288" text-anchor="middle" fill="#14532d" font-size="12">subtotal + tax = total · due ≥ issue · plazo del contrato</text>
  <text x="800" y="304" text-anchor="middle" fill="#14532d" font-size="12">redacción PII (email, SSN, IBAN, Luhn, teléfono)</text>
  <text x="800" y="320" text-anchor="middle" fill="#6d28d9" font-size="12">LLM-as-judge (rúbrica numerada, 5 criterios)</text>

  <!-- arrow validate -> score -->
  <line x1="640" y1="280" x2="602" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- score -->
  <rect x="400" y="230" width="200" height="100" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="254" text-anchor="middle" font-weight="bold" fill="#78350f">n_score</text>
  <text x="500" y="272" text-anchor="middle" fill="#78350f" font-size="12">conf = media × (0.5 + 0.5·cobertura)</text>
  <text x="500" y="288" text-anchor="middle" fill="#78350f" font-size="12">− 0.10·errores − 0.03·avisos</text>
  <text x="500" y="308" text-anchor="middle" fill="#78350f" font-size="12">≥0.90 auto · ≥0.70 humano · &lt;0.70 VLM</text>

  <!-- routing outputs -->
  <line x1="400" y1="260" x2="362" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="238" width="160" height="44" rx="8" fill="#bbf7d0" stroke="#15803d"/>
  <text x="280" y="265" text-anchor="middle" font-weight="bold" fill="#14532d">auto_approve</text>

  <line x1="400" y1="300" x2="362" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="290" width="160" height="44" rx="8" fill="#fde68a" stroke="#b45309"/>
  <text x="280" y="317" text-anchor="middle" font-weight="bold" fill="#78350f">human_review</text>

  <!-- vlm reprocess loop -->
  <line x1="500" y1="330" x2="500" y2="378" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="380" y="380" width="240" height="80" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="500" y="404" text-anchor="middle" font-weight="bold" fill="#4c1d95">n_vlm_reprocess</text>
  <text x="500" y="422" text-anchor="middle" fill="#4c1d95" font-size="12">routing == vlm_fallback y hay llave</text>
  <text x="500" y="438" text-anchor="middle" fill="#4c1d95" font-size="12">VLMExtractor sobre imágenes (Claude Vision)</text>
  <text x="500" y="454" text-anchor="middle" fill="#4c1d95" font-size="12">→ vuelve a n_validate una sola vez</text>
  <path d="M620,420 C700,420 760,400 800,335" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- response / storage -->
  <rect x="20" y="380" width="330" height="80" rx="10" fill="#e2e8f0" stroke="#475569"/>
  <text x="185" y="404" text-anchor="middle" font-weight="bold" fill="#0f172a">Respuesta + observabilidad</text>
  <text x="185" y="422" text-anchor="middle" fill="#334155" font-size="12">fields · tables · findings · routing · node_log</text>
  <text x="185" y="438" text-anchor="middle" fill="#334155" font-size="12">latency_ms · tokens · cost_usd · X-Trace-Id</text>
  <text x="185" y="454" text-anchor="middle" fill="#334155" font-size="12">Postgres (psycopg pool) · /api/metrics/recent · LangSmith</text>
  <line x1="280" y1="334" x2="200" y2="378" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="282" x2="215" y2="378" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- eval -->
  <rect x="20" y="480" width="940" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="490" y="499" text-anchor="middle" fill="#334155" font-size="12">python -m eval.run: 105 documentos (100 sintéticos con semilla + 5 FUNSD) × modos text / pdf / scanned + 30 tablas → eval/runs/*.json → eval/RESULTS.md</text>
</svg>
