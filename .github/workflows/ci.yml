name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests, eval smoke
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ""
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tesseract (OCR path)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .

      - name: mypy --strict
        run: mypy --strict src/

      - name: pytest with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Evaluation set is reproducible (manifest matches a fresh generation)
        run: |
          python scripts/generate_synthetic.py
          python scripts/build_manifest.py > /dev/null
          git diff --exit-code -- data/eval data/MANIFEST.txt

      - name: Eval smoke run (heuristic pipeline, 10 cases, no artifacts written)
        run: python -m eval.run --pipelines heuristic --limit 10 --skip-scanned --no-write

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
